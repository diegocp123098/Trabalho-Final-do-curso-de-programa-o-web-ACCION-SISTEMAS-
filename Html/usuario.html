<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Usuários</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body class="crud-body">

    <div class="crud-container">
        <h2 class="crud-titulo">Gerenciamento de Usuários</h2>

        <div class="crud-toolbar" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 25px; width: 100%;">
            
            <div class="toolbar-botoes" style="display: flex; gap: 10px; align-items: center;">
                <button type="button" class="botao btn-primario btn-auto" onclick="abrirModal()">+ Novo Usuário</button>
                <a href="menu.html" class="botao botao-secundario btn-auto">Voltar ao Menu</a>
            </div>

            <div class="toolbar-pesquisa" style="display: flex; gap: 15px; flex: 1; max-width: 550px; justify-content: flex-end;">
                
                <div class="input-group" style="flex: 1; margin-bottom: 0 !important; min-width: 100px;">
                    <label for="buscaId" class="crud-label" style="margin-bottom: 5px; display: block;">Código:</label>
                    <input type="number" id="buscaId" class="crud-input" placeholder="Ex: 1" oninput="filtrarUsuarios()" style="width: 100%;">
                </div>
                
                <div class="input-group" style="flex: 2; margin-bottom: 0 !important; min-width: 220px;">
                    <label for="buscaNome" class="crud-label" style="margin-bottom: 5px; display: block;">Pesquisar Usuário:</label>
                    <input type="text" id="buscaNome" class="crud-input" placeholder="Login ou nome..." oninput="filtrarUsuarios()" style="width: 100%;">
                </div>

            </div>
        </div>

        <div class="table-container">
            <table class="crud-table">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Usuário (Login)</th>
                        <th>Nome Completo</th>
                        <th class="col-acoes">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                    <tr>
                        <td colspan="4" class="txt-center">Carregando usuários...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="areaEdicao" class="edit-card" style="display: none;">
            <h3>Editar Usuário</h3>
            
            <input type="hidden" id="usuarioId">
            
            <div class="input-group">
                <label for="loginUserEdicao" class="crud-label">Usuário (Login):</label>
                <input type="text" id="loginUserEdicao" class="crud-input">
            </div>

            <div class="input-group">
                <label for="nomeUserEdicao" class="crud-label">Nome Completo:</label>
                <input type="text" id="nomeUserEdicao" class="crud-input">
            </div>

            <div class="input-group">
                <label for="senhaUserEdicao" class="crud-label">Nova Senha (deixe em branco para manter a atual):</label>
                <input type="password" id="senhaUserEdicao" class="crud-input" placeholder="********">
            </div>

            <div class="crud-toolbar">
                <button type="button" class="botao btn-salvar btn-auto" onclick="salvarEdicao()">Salvar Alterações</button>
                <button type="button" class="botao botao-secundario btn-auto" onclick="cancelarEdicao()">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalUsuario" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 class="modal-titulo">Novo Usuário</h2>
            <form id="formCadastroUsuario">
                <div class="input-group">
                    <label for="loginUserCad" class="crud-label">Usuário (Login):</label>
                    <input type="text" id="loginUserCad" class="crud-input" placeholder="Ex: ADMIN">
                </div>
                
                <div class="input-group">
                    <label for="nomeUserCad" class="crud-label">Nome Completo:</label>
                    <input type="text" id="nomeUserCad" class="crud-input" placeholder="Digite o nome completo">
                </div>

                <div class="input-group">
                    <label for="senhaUserCad" class="crud-label">Senha:</label>
                    <input type="password" id="senhaUserCad" class="crud-input" placeholder="********">
                </div>
                
                <div class="modal-acoes">
                    <button type="button" class="botao btn-primario" onclick="adicionarUsuario()">Salvar Usuário</button>
                    <button type="button" class="botao btn-fechar" onclick="fecharModal()">Fechar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javaScript/bancoDados.js"></script>
    <script src="../javaScript/usuario.js"></script>
</body>
</html>
