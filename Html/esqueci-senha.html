<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body class="recuperar-body">
    <form id="formRecuperar" onsubmit="recuperarSenha(event)" class="recuperar-card">
        <div class="recuperar-content">
            <h1 class="recuperar-titulo">Recuperar Senha</h1>
            
            <label for="usuario" class="recuperar-label">Digite seu Usuário:</label>
            <input type="text" placeholder="Ex: ADMIN" name="usuario" id="usuario" class="recuperar-input" required>
            
            <label for="nomeCompleto" class="recuperar-label">Digite seu Nome Completo:</label>
            <input type="text" placeholder="Ex: ADMIN" name="nomeCompleto" id="nomeCompleto" class="recuperar-input" required>
            
            <label for="novaSenha" class="recuperar-label">Digite a Nova Senha:</label>
            <input type="password" placeholder="Digite a nova senha" name="novaSenha" id="novaSenha" class="recuperar-input" required>
        </div>
        <div class="recuperar-acoes">
            <button type="submit" class="botao botao-alterar" id="btnSalvar">Alterar Senha</button>
            <a href="login.html" class="botao botao-secundario btn-voltar">Voltar ao Login</a>
        </div>
    </form>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javaScript/bancoDados.js"></script>
    <script src="../javaScript/login.js"></script>

</body>
</html>
