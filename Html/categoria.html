<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Gerenciar Categorias</title>
</head>
<body class="crud-body">

    <div class="crud-container">
        <h2 class="crud-titulo">Categorias Cadastradas</h2>
        
        <div class="crud-toolbar" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 25px; width: 100%;">
            
            <div class="toolbar-botoes" style="display: flex; gap: 10px; align-items: center;">
                <button type="button" class="botao btn-primario btn-auto" onclick="abrirModal()">+ Nova Categoria</button>
                <a href="menu.html" class="botao botao-secundario btn-auto">Voltar ao Menu</a>
            </div>

            <div class="toolbar-pesquisa" style="display: flex; gap: 15px; flex: 1; max-width: 550px; justify-content: flex-end;">
                
                <div class="input-group" style="flex: 1; margin-bottom: 0 !important; min-width: 100px;">
                    <label for="buscaId" class="crud-label" style="margin-bottom: 5px; display: block;">ID:</label>
                    <input type="number" id="buscaId" class="crud-input" placeholder="Ex: 1" oninput="filtrarCategorias()" style="width: 100%;">
                </div>
                
                <div class="input-group" style="flex: 2; margin-bottom: 0 !important; min-width: 220px;">
                    <label for="buscaDescricao" class="crud-label" style="margin-bottom: 5px; display: block;">Pesquisar Categoria:</label>
                    <input type="text" id="buscaDescricao" class="crud-input" placeholder="Digite o nome..." oninput="filtrarCategorias()" style="width: 100%;">
                </div>

            </div>
        </div>

        <div class="table-container">
            <table class="crud-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Categoria</th>
                    <th class="col-acoes">Ações</th> 
                </tr>
            </thead>

            <tbody id="tabelaCategorias">
                <tr>
                    <td colspan="3" class="txt-center">Carregando categorias...</td>
                </tr>
            </tbody>
            </table>
        </div>

        <div id="areaEdicao" class="edit-card" style="display: none;">
            <h3>Editar Categoria</h3>
            
            <input type="hidden" id="categoriaId">
            
            <div class="input-group">
                <label for="idCategoriaVisivel" class="crud-label">ID:</label>
                <input type="text" id="idCategoriaVisivel" class="crud-input input-readonly" placeholder="ID" readonly>
            </div>

            <div class="input-group">
                <label for="nomeCategoria" class="crud-label">Categoria</label>
                <input type="text" id="nomeCategoria" class="crud-input" placeholder="Nome da Categoria">
            </div>

            <div class="crud-toolbar">
                <button type="button" class="botao btn-salvar btn-auto" onclick="salvarEdicao()">Salvar Alterações</button>
                <button type="button" class="botao botao-secundario btn-auto" onclick="cancelarEdicao()">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalCadastro" class="modal-overlay">
        <div class="modal-content">
            <form action="">
                <h1 class="modal-titulo">Nova Categoria</h1>
                
                <div class="input-group">
                    <label for="descricao" class="crud-label">Descrição / Nome da Categoria:</label>
                    <input type="text" id="descricao" class="crud-input" placeholder="Ex: CHAPAS, ACESSÓRIOS, FERRAGENS">    
                    
                    <div class="modal-acoes">
                        <button type="button" class="botao btn-primario" onclick="adicionarCategoria()">Cadastrar Categoria</button>
                        <button type="button" class="botao btn-fechar" onclick="fecharModal()">Fechar</button>      
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javaScript/bancoDados.js"></script>
    <script src="../javaScript/categoria.js"></script>
</body>
</html>
